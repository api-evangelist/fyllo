aid: fyllo
name: Semasio
description: 'Semasio is a Hamburg, Germany advertising-technology company whose semantic
  targeting platform builds audience, contextual and brand-fit segments for brands,
  agencies and DSPs across roughly 30 languages and 50 countries. Founded in 2010,
  it was acquired in 2022 by Casters Holdings, Inc. operating under the Fyllo brand;
  the combined business traded as Fyllo|Semasio, rebranded to Semasio in April 2024,
  and was acquired by Samba TV on 31 October 2024. Products include Audience Targeting,
  Audience Extension, Contextual Targeting, ContextualPLUS, Brand Fit, Interactive
  Screens, HypertailPMP and the Semasio Factory data onboarding and modeling service.
  Semasio operates a login-only platform (uip.semasio.net) behind an authentik single
  sign-on host and publishes no public developer program, API reference, SDK or machine-readable
  specification.'
